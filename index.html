<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arif CCTV Calculator - Mixed Resolution</title>
    <meta name="description" content="Free Online CCTV Calculator with Mixed Resolution support. Calculate HDD, Cable & PoE Switch for different megapixel cameras.">
    <style>
        body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px}
        .wrap{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
        h1{text-align:center;font-size:22px;margin-bottom:5px}
        .small{color:#666;font-size:13px;text-align:center;margin-bottom:15px}
        label{display:block;margin-top:14px;font-weight:bold}
        input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
        button{background:#0a7a3d;color:#fff;border:none;font-weight:bold;cursor:pointer}
        button:hover{background:#086b34}
        .btn-add{background:#2563eb;margin-top:10px}
        .btn-add:hover{background:#1d4ed8}
        .btn-remove{background:#dc2626;width:auto;padding:8px 14px;font-size:14px;margin-top:0}
        .btn-remove:hover{background:#b91c1c}
        .group{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px;position:relative}
        .group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .group-title{font-weight:bold;color:#334155}
        .result{display:none;background:#eef8f1;padding:14px;border-radius:12px;margin-top:18px}
        .hint{font-size:12px;color:#888;margin-top:4px}
        .affiliate-box{margin-top:15px;padding:10px;background:#fff8e7;border:1px dashed #f0a500;border-radius:8px;text-align:center}
        .affiliate-box a{color:#d97706;font-weight:bold;text-decoration:none}
        .row{display:flex;gap:10px}
        .row > div{flex:1}
    </style>
</head>
<body>
<div class="wrap">
    <h1>📹 Arif CCTV Calculator</h1>
    <p class="small">Mixed Resolution Support • Works on Mobile & Laptop</p>

    <label>Average Cable per Camera (m)</label>
    <input id="cable" type="number" value="30" min="1">

    <label>Camera Type</label>
    <select id="type">
        <option>IP (PoE)</option>
        <option>Analog</option>
    </select>

    <label>Recording Days</label>
    <input id="days" type="number" value="30" min="1" placeholder="e.g. 30, 90, 180, 365">
    <div class="hint">30 = 1 month • 90 = 3 months • 180 = 6 months • 365 = 1 year</div>

    <label style="margin-top:20px;">Camera Groups</label>
    <div id="groups"></div>

    <button class="btn-add" onclick="addGroup()">+ Add Camera Group</button>

    <button onclick="calc()" style="margin-top:16px;">Calculate</button>

    <div class="result" id="out">
        <p><b>Total Cameras:</b> <span id="totalCams"></span></p>
        <p><b>Total Cable:</b> <span id="tc"></span> m</p>
        <p><b>NVR:</b> <span id="nvr"></span> Channel</p>
        <p><b>PoE Switch:</b> <span id="poe"></span></p>
        <p><b>Estimated HDD:</b> <span id="hdd"></span></p>
        
        <div class="affiliate-box">
            🛒 <a href="https://www.amazon.com" target="_blank">Buy Recommended Surveillance Hard Drive</a>
        </div>
    </div>
</div>

<script>
const gbMap = {
    1: 5, 2: 8, 3: 12, 4: 16, 5: 20,
    6: 24, 8: 32, 12: 45, 16: 60, 20: 80
};

let groupCount = 0;

function addGroup(cams = 4, res = 4) {
    groupCount++;
    const id = groupCount;
    const div = document.createElement("div");
    div.className = "group";
    div.id = "group-" + id;
    div.innerHTML = `
        <div class="group-header">
            <span class="group-title">Group ${id}</span>
            <button class="btn-remove" onclick="removeGroup(${id})">Remove</button>
        </div>
        <div class="row">
            <div>
                <label style="margin-top:0;font-size:14px;">Cameras</label>
                <input type="number" class="cams-input" value="${cams}" min="1">
            </div>
            <div>
                <label style="margin-top:0;font-size:14px;">Resolution</label>
                <select class="res-input">
                    <option value="1" ${res==1?'selected':''}>1MP</option>
                    <option value="2" ${res==2?'selected':''}>2MP</option>
                    <option value="3" ${res==3?'selected':''}>3MP</option>
                    <option value="4" ${res==4?'selected':''}>4MP</option>
                    <option value="5" ${res==5?'selected':''}>5MP</option>
                    <option value="6" ${res==6?'selected':''}>6MP</option>
                    <option value="8" ${res==8?'selected':''}>8MP</option>
                    <option value="12" ${res==12?'selected':''}>12MP</option>
                    <option value="16" ${res==16?'selected':''}>16MP</option>
                    <option value="20" ${res==20?'selected':''}>20MP+</option>
                </select>
            </div>
        </div>
    `;
    document.getElementById("groups").appendChild(div);
}

function removeGroup(id) {
    const el = document.getElementById("group-" + id);
    if (el) el.remove();
}

function calc() {
    const cable = +document.getElementById("cable").value;
    const days = +document.getElementById("days").value;
    const type = document.getElementById("type").value;

    if (cable < 1 || days < 1) {
        alert("Please enter valid Cable and Days (minimum 1)");
        return;
    }

    const groups = document.querySelectorAll(".group");
    if (groups.length === 0) {
        alert("Please add at least one Camera Group");
        return;
    }

    let totalCams = 0;
    let totalGB = 0;

    groups.forEach(g => {
        const cams = +g.querySelector(".cams-input").value;
        const res = +g.querySelector(".res-input").value;
        if (cams < 1) return;
        totalCams += cams;
        totalGB += (gbMap[res] || 16) * cams * days;
    });

    if (totalCams === 0) {
        alert("Please enter valid number of cameras");
        return;
    }

    const totalCable = totalCams * cable;
    const tb = totalGB / 1024;

    // NVR
    let nvr = totalCams <= 4 ? 4 : totalCams <= 8 ? 8 : totalCams <= 16 ? 16 : totalCams <= 32 ? 32 : 64;

    // PoE
    let poe = type.startsWith("IP") ? nvr + " Port" : "Not Required";

    // HDD recommendation
    let h;
    if (tb <= 1) h = "1TB";
    else if (tb <= 2) h = "2TB";
    else if (tb <= 4) h = "4TB";
    else if (tb <= 6) h = "6TB";
    else if (tb <= 8) h = "8TB";
    else if (tb <= 10) h = "10TB";
    else if (tb <= 12) h = "12TB";
    else if (tb <= 16) h = "16TB";
    else if (tb <= 20) h = "20TB";
    else if (tb <= 24) h = "24TB";
    else h = "24TB+ (Multiple HDDs recommended)";

    document.getElementById("totalCams").textContent = totalCams;
    document.getElementById("tc").textContent = totalCable;
    document.getElementById("nvr").textContent = nvr;
    document.getElementById("poe").textContent = poe;
    document.getElementById("hdd").textContent = h + " (≈ " + tb.toFixed(1) + " TB)";
    document.getElementById("out").style.display = "block";
}

// Start with one default group
addGroup(8, 4);
</script>
</body>
</html>
