<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arif CCTV Calculator - Calculate HDD, Cable & PoE Switch</title>
    <meta name="description" content="Free Online CCTV Calculator to estimate Hard Disk Drive (HDD) capacity, cable length, and PoE switch ports for IP and Analog cameras.">
    <style>
        body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:20px}
        .wrap{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
        h1{text-align:center;font-size:24px}
        label{display:block;margin-top:14px;font-weight:bold}
        input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
        button{background:#0a7a3d;color:#fff;border:none;font-weight:bold;cursor:pointer}
        button:hover{background:#086b34}
        .result{display:none;background:#eef8f1;padding:14px;border-radius:12px;margin-top:18px}
        .small{color:#666;font-size:13px;text-align:center}
        .affiliate-box{margin-top:15px;padding:10px;background:#fff8e7;border:1px dashed #f0a500;border-radius:8px;text-align:center}
        .affiliate-box a{color:#d97706;font-weight:bold;text-decoration:none}
        .hint{font-size:12px;color:#888;margin-top:4px}
    </style>
</head>
<body>
<div class="wrap">
    <h1>📹 Arif CCTV Calculator</h1>
    <p class="small">Works on Android • iPhone • Laptop</p>
    
    <label>Number of Cameras</label>
    <input id="cams" type="number" value="8" min="1">
    
    <label>Average Cable per Camera (m)</label>
    <input id="cable" type="number" value="30" min="1">
    
    <label>Camera Type</label>
    <select id="type">
        <option>IP (PoE)</option>
        <option>Analog</option>
    </select>
    
    <label>Resolution</label>
    <select id="res">
        <option value="2">2MP</option>
        <option value="4" selected>4MP</option>
        <option value="8">8MP</option>
    </select>
    
    <label>Recording Days</label>
    <input id="days" type="number" value="30" min="1" placeholder="e.g. 30, 90, 180, 365">
    <div class="hint">Example: 30 = 1 month • 90 = 3 months • 180 = 6 months • 365 = 1 year</div>
    
    <button onclick="calc()">Calculate</button>
    
    <div class="result" id="out">
        <p><b>Total Cable:</b> <span id="tc"></span> m</p>
        <p><b>NVR:</b> <span id="nvr"></span> Channel</p>
        <p><b>PoE Switch:</b> <span id="poe"></span></p>
        <p><b>Estimated HDD:</b> <span id="hdd"></span></p>
        
        <div class="affiliate-box">
            🛒 <a href="https://www.amazon.com" target="_blank" id="buy-link">Buy Recommended Surveillance Hard Drive</a>
        </div>
    </div>
</div>

<script>
function calc(){
    let cams = +document.getElementById("cams").value;
    let cable = +document.getElementById("cable").value;
    let res = +document.getElementById("res").value;
    let days = +document.getElementById("days").value;
    let type = document.getElementById("type").value;

    if(cams < 1 || cable < 1 || days < 1){
        alert("Please enter valid numbers (minimum 1)");
        return;
    }

    let total = cams * cable;
    
    // NVR size
    let nvr = cams <= 4 ? 4 : cams <= 8 ? 8 : cams <= 16 ? 16 : cams <= 32 ? 32 : 64;
    
    // PoE Switch
    let poe = type.startsWith("IP") ? nvr + " Port" : "Not Required";
    
    // Storage calculation (GB per day per camera)
    let gbPerDay = {2:8, 4:16, 8:32}[res];
    let totalGB = gbPerDay * cams * days;
    let tb = totalGB / 1024;
    
    // Better HDD recommendation
    let h;
    if(tb <= 1) h = "1TB";
    else if(tb <= 2) h = "2TB";
    else if(tb <= 4) h = "4TB";
    else if(tb <= 6) h = "6TB";
    else if(tb <= 8) h = "8TB";
    else if(tb <= 10) h = "10TB";
    else if(tb <= 12) h = "12TB";
    else if(tb <= 16) h = "16TB";
    else if(tb <= 20) h = "20TB";
    else h = "20TB+ (Multiple HDDs recommended)";
    
    document.getElementById("tc").textContent = total;
    document.getElementById("nvr").textContent = nvr;
    document.getElementById("poe").textContent = poe;
    document.getElementById("hdd").textContent = h + " (≈ " + tb.toFixed(1) + " TB)";
    document.getElementById("out").style.display = "block";
}
</script>
</body>
</html>
